<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frameworks & Internal Tools | Saurabh Rao</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0e10;
      --text: #f4f4f4;
      --accent: #6ec1e4;
      --highlight: #c4ff88;
      --fade: #c2c2c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    header {
      padding: 6rem 3rem 2rem;
      background: linear-gradient(to bottom, #11141a, #0c0e10);
      text-align: center;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      color: var(--highlight);
    }

    .grid-section {
  padding: 5rem 3rem;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3rem;
  max-width: 1200px;
  margin: 0 auto;
}

    .tool-card {
      background-color: #11141a;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .tool-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .tool-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .tool-card h3 {
  font-size: 1.2rem;
  padding: 1rem;
  color: var(--highlight);
  font-weight: 500;
  background-color: var(--bg);
  border-bottom: 1px solid #1a1d22;
}

    footer {
      text-align: center;
      padding: 5rem 2rem;
      font-size: 1rem;
      color: var(--fade);
      background-color: #11141a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Frameworks & Internal Tools</h1>
  </header>

  <section class="grid-section" id="frameworks-grid">
    <!-- JS will populate these cards dynamically -->
  </section>

  <footer>
    &copy; 2025 Saurabh Rao — Built with care & signal
  </footer>

  <script>
const tools = [
  {
    title: "Validator Blueprint for PG&E Datasets",
    description: "Packaged reusable test expectations and schema checks into a common Foundry library. Enabled other teams to plug into shared validation logic across ingestion pipelines.",
    source: "Resume - original brain dump.docx (PG&E)"
  },
  {
    title: "Docker + GitLab CI for Report Automation",
    description: "Containerized legacy scripts and deployed via GitLab CI runners to AWS EC2 for ad hoc and scheduled reporting workflows.",
    source: "Resume - original brain dump.docx (Aetna)"
  },
  {
    title: "Interactive Clinical Report Templates",
    description: "Standardized pptx generation logic for clinical protocol summaries; built editable web templates for business to dynamically control data storytelling.",
    source: "Resume - original brain dump.docx (Genentech)"
  },
  {
    title: "Shared Robot Keyword API Layer",
    description: "Wrapped REST APIs with keywords in Robot Framework for non-developer teams to run full router tests. Handled auth, retries, and assertions under the hood.",
    source: "Resume - original brain dump.docx (Charter)"
  },
  {
    title: "Slack-Integrated Alert Hooks",
    description: "Built lambda-triggered alerting flows that piped ingest failures and schema drifts to Slack with detailed tracebacks for resolution.",
    source: "Resume - original brain dump.docx (PG&E)"
  },
  {
    title: "S3-Powered Asset Dashboards",
    description: "Auto-generated Tableau dashboards from streaming asset data stored in S3, including fault metadata and inspection summaries.",
    source: "Resume - original brain dump.docx (PG&E)"
  },
  {
    title: "NLP Field Extractor for Risk Models",
    description: "Used regex + NLP pipelines to extract sensitive fields from insurer records for compliance tagging. Handled field ambiguity using dictionary and POS heuristics.",
    source: "Resume - original brain dump.docx (Aetna)"
  },
  {
    title: "Contracted Worker Intake Form Engine",
    description: "Built low-code framework to onboard third-party resources via intake forms and approval chains. Tied into internal systems with webhook-based triggers.",
    source: "Resume - original brain dump.docx (ACI / Johnson & Johnson)"
  },
  {
    title: "Hashtag Moodboard Pipeline",
    description: "Instagram scraping pipeline for marketing teams to generate post moodboards. Filtered by hashtag, engagement, and timestamp.",
    source: "Resume - original brain dump.docx (Indorama)"
  },
  {
    title: "Dynamic Report Filtering via Lambda + JSON",
    description: "Created AWS Lambda endpoints that filtered clinical JSON payloads per user input before embedding into templated PowerPoint exports.",
    source: "Resume - original brain dump.docx (Genentech)"
  }
  ];
    const grid = document.getElementById('frameworks-grid');

    tools.forEach(tool => {
      const card = document.createElement('div');
            card.classList.add('tool-card');
      card.innerHTML = `
  <h3>${tool.title}</h3>
  <img src="${tool.image}" alt="${tool.title}" />
`;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
